<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{{ name }}</title>
        <style>
            body {
				min-height: 100vh;
				font-family: 'Roboto', sans-serif;
				background: #1f2023;
                color: white;
			}
        </style>
    </head>
    <body>
        Name: <input id="name" value="{{ name }}"><br>
        Description: <br>
        <textarea id="description">{{ description }}</textarea><br><br>
        Shifts:<br>
        <button onclick="location.href = '/organization/{{ organization_id }}/create-shift'">Create Shift</button>
        <ul id="shifts"></ul><br><br>
        Volunteers: 
        <ul id="volunteers"></ul><br><br>
        <button onclick="saveChanges();">Save Changes</button><br>
        <button onclick="back();">Back</button>
        <script>
            let shifts = JSON.parse('{{ shifts | safe }}');
            let volunteers = JSON.parse('{{ volunteers | safe }}');
            let oldName = "{{ name | safe }}";
            let oldDescription = "{{ description | safe }}";

            for (let shiftID in shifts) {
                let element = document.createElement("li");
                element.innerHTML = `<a href="/organization/{{ organization_id }}/shift/${shiftID}">${shifts[shiftID]}</a>`;
                document.getElementById("shifts").appendChild(element);
            }

            for (let username in volunteers) {
                let element = document.createElement("li")
                element.innerHTML = `${username}: <b>${volunteers[username]}</b> hours`
                document.getElementById("volunteers").appendChild(element);
            }

            if (Object.keys(shifts).length == 0) {
                document.getElementById("shifts").innerHTML = "There have not been any shifts created for this organization.";
            }

            if (Object.keys(volunteers).length == 0) {
                document.getElementById("volunteers").innerHTML = "There are no volunteers joined in this organization.";
            }

            function saveChanges() {
                let newName = document.getElementById("name").value.trim();
                let newDescription = document.getElementById("description").value.trim();

                if (newName === "" || newDescription === "") {
                    alert("No fields can be blank.");
                }

                else if (oldName !== newName || oldDescription !== newDescription) {
                    fetch("/request", {
                        "method": "POST",
                        "body": JSON.stringify({
                            "purpose": "edit_organization_data",
                            "organization_id": "{{ organization_id }}",
                            "name": newName,
                            "description": newDescription
                        })
                    })
                    .then(response => response.text())
                    .then(data => {
                        if (data === "0") location.href = "/login";
                        if (data === "1") {
                            alert("You do not own this organization.");
                            location.href = "/dashboard";
                        }
                        alert("Changes saved.");
                    });
                }

                else {
                    alert("Changes saved.");
                }

                oldName = newName;
                oldDescription = newDescription;
            }

            function back() {
                let newName = document.getElementById("name").value.trim();
                let newDescription = document.getElementById("description").value.trim();
                let confirmation;

                if (oldName !== newName || oldDescription !== newDescription) {
                    confirmation = window.confirm("Discard changes?")
                }

                else {
                    confirmation = true;
                }

                if (confirmation) {
                    location.href = "/dashboard";
                }
            }
        </script>
    </body>
</html>
