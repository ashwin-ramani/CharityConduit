<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Create Shift</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg">
		<style>
			body {
				margin: 0;
				padding: 0;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				font-family: 'Roboto', sans-serif;
				background: #1f2023;
			}

			#form {
				width: 350px;
				height: 575px;
				overflow-y: scroll;
				border-radius: 10px;
				box-shadow: 5px 20px 50px #000;
				-ms-overflow-style: none;  /* IE and Edge */
  				scrollbar-width: none;  /* Firefox */
			}

			#form::-webkit-scrollbar {
				display: none;
			}

			input:not(.checkbox) {
				width: 65%;
				height: 25px;
				background: #e0dede;
				justify-content: center;
				display: flex;
				margin: 20px auto;
				padding: 10px;
				border: none;
				outline: none;
				border-radius: 5px;
			}

			.time {
                width: 65%;
				height: 45px;
				background: #e0dede;
				justify-content: center;
				display: flex;
				margin: 20px auto;
				padding: 10px;
				border: none;
				outline: none;
				border-radius: 5px; 
            }

			#createButton {
				width: 60%;
				height: 40px;
				margin: 10px auto;
				justify-content: center;
				display: block;
				color: #fff;
				background: #6366f1;
				font-size: 1em;
				font-weight: bold;
				margin-top: 20px;
				outline: none;
				border: none;
				border-radius: 5px;
				cursor: pointer;
			}
			#createButton:hover {
				background-color: #7274f3;
			}

			#backButton {
				width: 60%;
				height: 40px;
				margin: 10px auto;
				justify-content: center;
				display: block;
				color: #fff;
				background: none;
				font-size: 1em;
				font-weight: bold;
				margin-top: 20px;
				outline: #6366f1;
				border: solid #6366f1 2px;
				border-radius: 5px;
				cursor: pointer;
			}
			#backButton:hover {
				outline: #7274f3;
				border: solid #7274f3 2px;
			}

			h1 {
				text-align: center;
				color: #6366f1;
			}

			b {
                color: white;
                margin-left: 20px;
            }

			#days {
				color: white;
				margin-left: 20px;
			}

			#innerErrorBox {
				width: 80%;
				margin: 10px auto;
				text-align: center;
				line-height: 40px;
				color: #fff;
				border: solid red 2px;
				background: #f54e4e;
				font-size: 16px;
				font-weight: bold;
				margin-top: 20px;
				border-radius: 3px;
			}

			#errorBox {
				display: none;
			}
		</style>
	</head>
	<body>
		<div id="form">
			<br><h1>Create Shift</h1><br>
			<div id="errorBox"><div id="innerErrorBox"><span id="errorText"></span></div><br></div>
            <b>Shift Name</b><br>
			<input id="name" placeholder="A-Z, a-z, 0-9"><br>
            <b>Shift Description</b><br>
            <input id="description" placeholder="Long response..."><br>
            <b>Earliest start time</b><br>
            <input id="startTime" type="time"><br>
            <b>Latest end time</b><br>
            <input id="endTime" type="time"><br>
            <b>Max holders</b><br>
            <input id="maxHolders" placeholder="0"><br>
            <b>Days</b><br>
            <ul id="days">
                <input type="checkbox" class="checkbox" id="Sunday"> Sunday<br>
                <input type="checkbox" class="checkbox" id="Monday"> Monday<br>
                <input type="checkbox" class="checkbox" id="Tuesday"> Tuesday<br>
                <input type="checkbox" class="checkbox" id="Wednesday"> Wednesday<br>
                <input type="checkbox" class="checkbox" id="Thursday"> Thursday<br>
                <input type="checkbox" class="checkbox" id="Friday"> Friday<br>
                <input type="checkbox" class="checkbox" id="Saturday"> Saturday<br>
            </ul>
			<button onclick="create();" id="createButton">Create</button>
			<button onclick="back();" id="backButton">Back</button>
		</div>
		<script>
			function error(text) {
				let errorBox = document.getElementById("errorBox");
				let errorText = document.getElementById("errorText");
				errorText.innerText = text;
				let numLines = errorText.offsetHeight / parseInt(errorText.style.lineHeight);
				errorBox.style.height = `${16 * numLines + 24}px`;
				errorBox.style.display = "block";
				document.getElementById("form").scrollTop = 0;
			}

			function isValidDigit(text) {
				let number = Number.parseInt(text);
				if (isNaN(number)) return false;
				if (number < 1) return false;
				return true;
			}

			function create() {
				let name = document.getElementById("name").value.trim();
				let description = document.getElementById("description").value.trim();
				let startTime = document.getElementById("startTime").value;
				let endTime = document.getElementById("endTime").value;
				let maxHolders = document.getElementById("maxHolders").value;
				let days = [];

				for (let day of ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]) {
					if (document.getElementById(day).checked) days.push(day);
				}

				if (name === "" || description === "" || startTime === "" || endTime === "" || maxHolders === "") {
					return error("No fields can be blank.");
				}

				else if (!isValidDigit(maxHolders)) {
					return error("Max holders must be a valid integer greater than 0.");
				}

				else if (days.length == 0) {
					return error("At least one day must be selected.");
				}

				fetch("/request", {
					"method": "POST",
					"body": JSON.stringify({
						"purpose": "create_shift",
						"organization_id": "{{ organization_id }}",
						"name": name,
						"description": description,
						"start_time": startTime,
						"end_time": endTime,
						"max_holders": maxHolders,
						"days": days
					})
				})
				.then(response => response.text())
				.then(data => {
					if (data === "0" || data === "1") {
						alert("An error occured. You either do not own this organization or are not properly logged in.");
						location.href = "/login";
					}
					if (data === "-1") error("End time must be greater than start time.");
					else {
						back();
					}
				});
			}


			function back() {
				location.href = "/organization/{{ organization_id }}/settings";
			}
		</script>
	</body>
</html>
