<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Login</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg">
		<style>
			body {
				margin: 0;
				padding: 0;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				font-family: 'Roboto', sans-serif;
				background: #1f2023;
			}

			#form {
				width: 350px;
				height: 500px;
				overflow: hidden;
				border-radius: 10px;
				box-shadow: 5px 20px 50px #000;
			}

			input {
				width: 65%;
				height: 25px;
				background: #e0dede;
				justify-content: center;
				display: flex;
				margin: 20px auto;
				padding: 10px;
				border: none;
				outline: none;
				border-radius: 5px;
			}

			#loginButton {
				width: 60%;
				height: 40px;
				margin: 10px auto;
				justify-content: center;
				display: block;
				color: #fff;
				background: #6366f1;
				font-size: 1em;
				font-weight: bold;
				margin-top: 20px;
				outline: none;
				border: none;
				border-radius: 5px;
				cursor: pointer;
			}
			#loginButton:hover {
				background-color: #7274f3;
			}

			#goToRegistrationButton {
				width: 60%;
				height: 40px;
				margin: 10px auto;
				justify-content: center;
				display: block;
				color: #fff;
				background: none;
				font-size: 1em;
				font-weight: bold;
				margin-top: 20px;
				outline: #6366f1;
				border: solid #6366f1 2px;
				border-radius: 5px;
				cursor: pointer;
			}
			#goToRegistrationButton:hover {
				outline: #7274f3;
				border: solid #7274f3 2px;
			}

			h1 {
				text-align: center;
				color: #6366f1;
			}

			#errorBox {
				display: none;
				width: 80%;
				height: 40px;
				margin: 10px auto;
				text-align: center;
				line-height: 40px;
				color: #fff;
				border: solid red 2px;
				background: #f54e4e;
				font-size: 1em;
				font-weight: bold;
				margin-top: 20px;
				border-radius: 3px;
			}
		</style>
	</head>
	<body>
		<div id="form">
			<br><h1>Login</h1><br>
			<div id="errorBox"></div>
			<input id="username" placeholder="Username">
			<input id="password" type="password" placeholder="Password"><br>
			<button onclick="login();" id="loginButton">Login</button>
			<button onclick="goToRegistration();" id="goToRegistrationButton">Create account</button>
		</div>
		<script>
			let inputElements = document.getElementsByTagName("input");
			for (let element of inputElements) {
				element.addEventListener("keydown", (event) => {
					if (event.key === "Enter") {
						login();
					}
				});
			}

			function error(text) {
				let element = document.getElementById("errorBox");
				element.innerText = text;
				element.style.display = "block";
				document.getElementById("form").scrollTop = 0;
			}

			function login() {
				let username = document.getElementById("username").value.trim();
				let password = document.getElementById("password").value;

				if (username === "" || password === "") return error("No fields can be blank.");

				fetch("/request", {
					"method": "POST",
					"body": JSON.stringify({
						"purpose": "login",
						"username": username,
						"password": password
					})
				})
				.then(response => response.text())
				.then(data => {
					if (data === "0") {
						error("Wrong username/password.");
					}
					else {
						location.href = "/dashboard";
					}
				})
			}


			function goToRegistration() {
				location.href = "/register";
			}
		</script>
	</body>
</html>
