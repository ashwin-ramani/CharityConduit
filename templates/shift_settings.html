<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ organization_name }} - {{ name }}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
            background: #1f2023;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 30px;
            background-color: #282c34;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            color: #fff;
            box-sizing: border-box;
        }

        input[type="text"],
        input[type="time"],
        input[type="number"],
        textarea {
            width: calc(100% - 40px);
            padding: 10px;
            margin: 5px 0 20px;
            border: none;
            outline: none;
            border-radius: 5px;
            background-color: #2f333d;
            color: #fff;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="time"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            background-color: #444a57;
        }

        /* Clock icon */
        input[type="time"]::-webkit-calendar-picker-indicator {
            color: #4CAF50 !important;
            font-size: 24px;
        }

        button {
            padding: 10px 20px;
            margin: 5px 0; 
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button.save {
            background-color: #6366f1;
        }

        button.delete {
            background-color: #f44336;
        }

        button.back {
            background-color: #008CBA;
        }

        button:hover {
            filter: brightness(90%);
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn-group button {
            flex: 1;
            margin: 0 5px;
        }

        label {
            margin-bottom: 5px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <label for="name">Name:</label>
        <input id="name" type="text" value="{{ name }}"><br>
        <label for="description">Description:</label>
        <textarea id="description">{{ description }}</textarea><br><br>
        <label for="startTime">Earliest start time:</label>
        <input id="startTime" type="time" value="{{ start_time }}"><br>
        <label for="endTime">Latest end time:</label>
        <input id="endTime" type="time" value="{{ end_time }}"><br>
        <label for="maxHolders">Max holders:</label>
        <input id="maxHolders" type="number" value="{{ max_holders }}" min="1" step="1"><br><br>
        <div class="btn-group">
            <button class="save" onclick="saveChanges();">Save Changes</button>
            <button class="delete" onclick="deleteShift()">Delete Shift</button>
            <button class="back" onclick="back();">Back</button>
        </div>
    </div>
    <script>
        let volunteers = JSON.parse('{{ volunteers | safe }}');
        let oldName = "{{ name | safe }}";
        let oldDescription = "{{ description | safe }}";
        let oldStartTime = "{{ start_time | safe }}";
        let oldEndTime = "{{ end_time | safe }}";
        let oldMaxHolders = "{{ max_holders | safe }}";

        if (Object.keys(volunteers).length === 0) {
            document.getElementById("volunteers").innerHTML = "There are no volunteers with this shift.";
        }

        function saveChanges() {
            let newName = document.getElementById("name").value.trim();
            let newDescription = document.getElementById("description").value.trim();
            let newStartTime = document.getElementById("startTime").value;
            let newEndTime = document.getElementById("endTime").value;
            let newMaxHolders = document.getElementById("maxHolders").value;

            if (newName === "" || newDescription === "" || newStartTime === "" || newEndTime === "" || newMaxHolders === "") {
                alert("No fields can be blank.");
            }
            else if (newMaxHolders < 1) {
                alert("Max holders must be a valid integer greater than 0.");
            }
            else if (oldName !== newName || oldDescription !== newDescription || oldStartTime !== newStartTime || oldEndTime !== newEndTime || oldMaxHolders !== newMaxHolders) {
                fetch("/request", {
                    method: "POST",
                    body: JSON.stringify({
                        purpose: "edit_shift_data",
                        organization_id: "{{ organization | safe }}",
                        id: "{{ id }}",
                        name: newName,
                        description: newDescription,
                        start_time: newStartTime,
                        end_time: newEndTime,
                        max_holders: newMaxHolders
                    })
                })
                .then(response => response.text())
                .then(data => {
                    if (data === "0") location.href = "/login";
                    if (data === "1") {
                        alert("You do not own this organization.");
                        location.href = "/dashboard";
                    }
                    if (data === "-1") alert("Changes could not be saved. The end time must be greater than the start time.");
                    else {
                        alert("Changes saved.");
                    }
                });
            } else {
                alert("No changes made.");
            }

            oldName = newName;
            oldDescription = newDescription;
            oldStartTime = newStartTime;
            oldEndTime = newEndTime;
            oldMaxHolders = newMaxHolders;
        }

        function deleteShift() {
            let promptInput = window.prompt("Enter the name of the shift to confirm deletion:");

            if (promptInput !== "{{ name | safe }}") {
                alert("Incorrect name.");
                return;
            }

            fetch("/request", {
                method: "POST",
                body: JSON.stringify({
                    purpose: "delete_shift",
                    id: "{{ id }}",
                    organization_id: "{{ organization | safe }}"
                })
            })
            .then(response => response.text())
            .then(data => {
                if (data === "0") location.href = "/login";
                if (data === "1") alert("You do not own this organization.");
                location.href = "/organization/{{ organization | safe }}/settings";
            });
        }

        function back() {
            let newName = document.getElementById("name").value.trim();
            let newDescription = document.getElementById("description").value.trim();
            let newStartTime = document.getElementById("startTime").value;
            let newEndTime = document.getElementById("endTime").value;
            let newMaxHolders = document.getElementById("maxHolders").value;
            let confirmation;

            if (oldName !== newName || oldDescription !== newDescription || oldStartTime !== newStartTime || oldEndTime !== newEndTime || oldMaxHolders !== newMaxHolders) {
                confirmation = window.confirm("Discard changes?");
            } else {
                confirmation = true;
            }

            if (confirmation) {
                location.href = "/organization/{{ organization | safe }}/settings";
            }
        }
    </script>
</body>
</html>
